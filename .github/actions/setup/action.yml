name: Setup
description: pnpm and Node with the dependencies installed from the lockfile.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10

    # jsdom needs Node 24.15+, which is what .nvmrc pins.
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
