name: Setup
description: pnpm and Node with the dependencies installed from the lockfile.

runs:
  using: composite
  steps:
    # No version here: the action reads packageManager from package.json, and
    # specifying both is an error.
    - uses: pnpm/action-setup@v4

    # jsdom needs Node 24.15+, which is what .nvmrc pins.
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
