name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, type-check, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # vite and jsdom need Node 22.12+, which is what .nvmrc pins.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lint, type check and the Vitest suite. No database: the tests run against
      # pure functions and the dummy DATABASE_URL in vitest.config.ts.
      - run: pnpm check
