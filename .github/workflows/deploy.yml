name: Deploy

# Merging to main does not deploy (vercel.json turns that off); production ships only from here,
# and every run cuts a changelog release from the entries merged since the last one.
on: workflow_dispatch

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      # Built remotely on Vercel, so next.config.ts counts deployments with the project's env.
      # stdout carries only the new deployment's URL; the progress goes to stderr.
      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(npx --yes vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Deployed $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The production domain, not the deployment URL: that one sits behind Vercel Authentication.
      # For a moment after the alias moves, the previous build can still answer. One without this
      # route redirects to /sk/api/release (307); one with it would answer 200 and cut nothing,
      # because it does not know the new entries. So the call names the deployment just made, the
      # route answers 503 from any other build, and both are retried until the new build answers.
      # Safe to re-run on its own; with nothing new it creates nothing and sends nothing.
      - name: Cut changelog release
        env:
          RELEASE_URL: ${{ vars.PRODUCTION_URL }}/api/release
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EXPECTED_DEPLOYMENT: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            status=$(curl --silent --show-error --output response.txt --write-out '%{http_code}' \
              -X POST "$RELEASE_URL" -H "Authorization: Bearer $CRON_SECRET" \
              -H "X-Expected-Deployment: $EXPECTED_DEPLOYMENT")
            cat response.txt
            echo
            case "$status" in
              200) exit 0 ;;
              3??|503) echo "Attempt $attempt: HTTP $status, the previous build still answers; retrying in 10 s"
                       sleep 10 ;;
              *) echo "The release failed with HTTP $status"
                 exit 1 ;;
            esac
          done
          echo "The new build still does not answer after $attempt attempts"
          exit 1
